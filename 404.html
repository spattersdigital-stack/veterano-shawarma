*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(50% 60% at 50% 30%,rgba(255,150,40,.18),transparent 70%),var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}

@keyframes spin{to{transform:rotate(360deg)}}

p{margin:1rem auto 0;max-width:46ch;color:var(--muted);font-size:1.05rem}

.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.btn-sun{background:var(--sun);color:var(--on-sun)}

  <p>Сторінки, яку ви шукаєте, немає. Можливо, посилання застаріло або в адресі помилка. Зате меню на місці і лаваш гарячий.</p>
